<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
  <title id="title">Travel Analyst Mock UX storyboard</title>
  <desc id="desc">A portfolio analytics dashboard and three connected screens showing package comparison, prioritized growth opportunities, and a package detail action.</desc>
  <defs>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#19342f}
      .muted{fill:#72817b}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#187a65}.title{font-size:34px;font-weight:720;letter-spacing:-1.2px}.h2{font-size:20px;font-weight:700;letter-spacing:-.35px}.h3{font-size:15px;font-weight:700}.value{font-size:25px;font-weight:730;letter-spacing:-.6px}.screen{fill:#fff;stroke:#e2e9e4;stroke-width:1.5}.soft{fill:#f4f7f4}.green{fill:#187a65}.greenText{fill:#11644f}.line{stroke:#e8eeea;stroke-width:1}.pill{fill:#e7f3ed}.shadow{filter:drop-shadow(0 8px 15px rgba(25,52,47,.06))}
    </style>
  </defs>
  <rect width="1440" height="1260" fill="#f6f8f5"/>
  <rect x="0" y="0" width="1440" height="12" fill="#187a65"/>
  <text x="58" y="63" class="label">WAYPOINT  /  TRAVEL PRODUCT INTELLIGENCE</text>
  <text x="58" y="112" class="title">Travel Analyst</text>
  <text x="58" y="144" class="body muted">A decision-first workspace for understanding package performance and choosing what to improve next.</text>
  <rect x="1102" y="72" width="276" height="42" rx="21" fill="#e7f3ed"/>
  <circle cx="1125" cy="93" r="5" fill="#187a65"/>
  <text x="1140" y="98" class="small greenText" font-weight="700">MOCK UX · PRIMARY JOURNEYS</text>

  <g class="shadow">
    <rect x="46" y="186" width="1348" height="408" rx="18" class="screen"/>
    <rect x="46" y="186" width="206" height="408" rx="18" fill="#fbfcfb"/>
    <path d="M252 186v408" class="line"/>
    <rect x="66" y="211" width="35" height="35" rx="10" class="green"/>
    <text x="83.5" y="234" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">W</text>
    <text x="111" y="225" class="h3">Waypoint</text>
    <text x="111" y="241" class="tiny muted">Product intelligence</text>
    <text x="68" y="283" class="tiny muted" font-weight="700" letter-spacing="1">WORKSPACE</text>
    <rect x="60" y="298" width="178" height="37" rx="8" fill="#e7f3ed"/>
    <text x="77" y="322" class="small greenText" font-weight="700">◫  Overview</text>
    <text x="77" y="362" class="small muted">⌑  Packages</text>
    <text x="77" y="397" class="small muted">✳  Opportunities</text>
    <path d="M60 537h178" class="line"/>
    <circle cx="80" cy="561" r="14" fill="#edf0df"/>
    <text x="80" y="565" text-anchor="middle" class="tiny" font-weight="700">AM</text>
    <text x="102" y="558" class="tiny" font-weight="700">Aarav Mehta</text>
    <text x="102" y="572" class="tiny muted">Product manager</text>

    <text x="281" y="221" class="tiny muted">Workspace  /  <tspan fill="#19342f" font-weight="700">Overview</tspan></text>
    <text x="281" y="260" class="label">PORTFOLIO OVERVIEW</text>
    <text x="281" y="291" class="h2">Good morning, Aarav</text>
    <text x="281" y="313" class="small muted">A clear view of how your travel portfolio is performing.</text>
    <rect x="1184" y="238" width="176" height="38" rx="8" class="green"/>
    <text x="1272" y="262" text-anchor="middle" class="small" fill="#fff" font-weight="700">View recommendations →</text>

    <g>
      <rect x="281" y="333" width="253" height="77" rx="10" class="soft"/>
      <text x="299" y="355" class="tiny muted">PORTFOLIO REVENUE</text>
      <text x="299" y="385" class="value">₹2.30 Cr</text>
      <text x="462" y="385" class="tiny greenText">↑ 12.8%</text>
      <rect x="547" y="333" width="253" height="77" rx="10" class="soft"/>
      <text x="565" y="355" class="tiny muted">TOTAL BOOKINGS</text>
      <text x="565" y="385" class="value">2,310</text>
      <text x="727" y="385" class="tiny greenText">↑ 8.4%</text>
      <rect x="813" y="333" width="253" height="77" rx="10" class="soft"/>
      <text x="831" y="355" class="tiny muted">AVG. SATISFACTION</text>
      <text x="831" y="385" class="value">4.63 <tspan font-size="14" class="muted">/ 5</tspan></text>
      <text x="1004" y="385" class="tiny greenText">↑ 0.2</text>
      <rect x="1079" y="333" width="281" height="77" rx="10" class="soft"/>
      <text x="1097" y="355" class="tiny muted">AVG. CONVERSION</text>
      <text x="1097" y="385" class="value">17.4%</text>
      <text x="1281" y="385" class="tiny greenText">↑ 1.6%</text>
    </g>

    <rect x="281" y="426" width="650" height="142" rx="10" fill="#fff" stroke="#e8eeea"/>
    <text x="301" y="453" class="h3">Revenue over time</text>
    <text x="301" y="471" class="tiny muted">Monthly revenue across active packages</text>
    <path d="M316 540h590M316 511h590M316 482h590" stroke="#edf1ee" fill="none"/>
    <path d="M326 533 C365 526 387 512 426 517 S482 502 516 507 S573 485 606 492 S665 476 698 481 S758 454 790 466 S847 440 895 443" fill="none" stroke="#25846d" stroke-width="3" stroke-linecap="round"/>
    <text x="320" y="559" class="tiny muted">JAN</text><text x="447" y="559" class="tiny muted">MAR</text><text x="574" y="559" class="tiny muted">MAY</text><text x="702" y="559" class="tiny muted">JUL</text><text x="830" y="559" class="tiny muted">SEP</text>

    <rect x="949" y="426" width="411" height="142" rx="10" fill="#f2f6e8"/>
    <rect x="969" y="444" width="128" height="22" rx="11" fill="#fff"/>
    <text x="1033" y="459" text-anchor="middle" class="tiny" font-weight="700" fill="#647642">✦ TOP OPPORTUNITY</text>
    <text x="969" y="488" class="h3">Himalayan Trek</text>
    <text x="969" y="508" class="tiny muted">Strong guest feedback, but booking demand is soft.</text>
    <text x="969" y="540" class="small greenText" font-weight="700">Potential monthly upside  +₹4.2L</text>
    <text x="1319" y="540" text-anchor="end" class="tiny greenText" font-weight="700">Explore →</text>

    <text x="281" y="583" class="tiny muted">PACKAGE PERFORMANCE  ·  Value scores help teams focus attention</text>
  </g>

  <text x="58" y="644" class="label">THE USER JOURNEY</text>
  <text x="58" y="676" class="h2">From portfolio signal to a confident next step</text>

  <g class="shadow">
    <rect x="46" y="704" width="428" height="374" rx="16" class="screen"/>
    <circle cx="77" cy="741" r="15" class="green"/>
    <text x="77" y="746" text-anchor="middle" class="small" fill="#fff" font-weight="700">1</text>
    <text x="102" y="746" class="h3">Find a package</text>
    <text x="70" y="774" class="tiny muted">Search, filter by region, and compare performance.</text>
    <rect x="70" y="795" width="378" height="222" rx="10" fill="#fbfcfb" stroke="#e8eeea"/>
    <text x="87" y="821" class="tiny muted" font-weight="700">TRAVEL PACKAGES</text>
    <rect x="87" y="835" width="228" height="27" rx="6" fill="#fff" stroke="#e1e8e3"/>
    <text x="99" y="853" class="tiny muted">⌕  Search packages or regions</text>
    <rect x="322" y="835" width="108" height="27" rx="6" fill="#fff" stroke="#e1e8e3"/>
    <text x="335" y="853" class="tiny muted">All regions  ▾</text>
    <text x="89" y="887" class="tiny muted" font-weight="700">PACKAGE</text><text x="295" y="887" class="tiny muted" font-weight="700">VALUE</text><text x="355" y="887" class="tiny muted" font-weight="700">TREND</text>
    <path d="M87 899h343M87 936h343M87 973h343" class="line"/>
    <text x="89" y="920" class="tiny" font-weight="700">Kerala Backwaters</text><text x="305" y="920" class="tiny greenText" font-weight="700">96</text><text x="355" y="920" class="tiny greenText">↗ Rising</text>
    <text x="89" y="957" class="tiny" font-weight="700">Goa Beach Retreat</text><text x="305" y="957" class="tiny greenText" font-weight="700">92</text><text x="355" y="957" class="tiny greenText">↗ Rising</text>
    <text x="89" y="994" class="tiny" font-weight="700">Himalayan Trek</text><text x="305" y="994" class="tiny greenText" font-weight="700">71</text><text x="355" y="994" class="tiny" fill="#bd5b53">↘ Declining</text>
    <text x="70" y="1048" class="tiny muted">Select two packages to compare side by side.</text>

    <rect x="506" y="704" width="428" height="374" rx="16" class="screen"/>
    <circle cx="537" cy="741" r="15" class="green"/>
    <text x="537" y="746" text-anchor="middle" class="small" fill="#fff" font-weight="700">2</text>
    <text x="562" y="746" class="h3">Review an opportunity</text>
    <text x="530" y="774" class="tiny muted">Prioritize ideas by impact and customer signal.</text>
    <rect x="530" y="795" width="380" height="222" rx="10" fill="#fbfcfb" stroke="#e8eeea"/>
    <text x="550" y="823" class="tiny muted" font-weight="700">RECOMMENDED ACTIONS</text>
    <text x="550" y="845" class="tiny muted">Ranked by potential business impact</text>
    <path d="M550 863h340M550 918h340M550 973h340" class="line"/>
    <circle cx="566" cy="888" r="12" fill="#edf2e5"/><text x="566" y="892" text-anchor="middle" class="tiny" font-weight="700">01</text>
    <text x="586" y="883" class="tiny" font-weight="700">Himalayan Trek</text><text x="586" y="899" class="tiny muted">Clarify trek difficulty and improve visibility</text><text x="870" y="890" text-anchor="end" class="tiny greenText" font-weight="700">+₹4.2L</text>
    <circle cx="566" cy="943" r="12" fill="#edf2e5"/><text x="566" y="947" text-anchor="middle" class="tiny" font-weight="700">02</text>
    <text x="586" y="938" class="tiny" font-weight="700">Kerala Backwaters</text><text x="586" y="954" class="tiny muted">Bring wellness highlights into booking flow</text><text x="870" y="945" text-anchor="end" class="tiny greenText" font-weight="700">+₹3.4L</text>
    <circle cx="566" cy="998" r="12" fill="#edf2e5"/><text x="566" y="1002" text-anchor="middle" class="tiny" font-weight="700">03</text>
    <text x="586" y="993" class="tiny" font-weight="700">Srinagar Houseboat</text><text x="586" y="1009" class="tiny muted">Use feedback to support high conversion</text><text x="870" y="1000" text-anchor="end" class="tiny greenText" font-weight="700">+₹2.9L</text>
    <text x="530" y="1048" class="tiny muted">Review the insight before committing an action.</text>

    <rect x="966" y="704" width="428" height="374" rx="16" class="screen"/>
    <circle cx="997" cy="741" r="15" class="green"/>
    <text x="997" y="746" text-anchor="middle" class="small" fill="#fff" font-weight="700">3</text>
    <text x="1022" y="746" class="h3">Choose a next step</text>
    <text x="990" y="774" class="tiny muted">Check package health, then save a team action.</text>
    <rect x="990" y="795" width="380" height="222" rx="10" fill="#fbfcfb" stroke="#e8eeea"/>
    <rect x="1011" y="814" width="78" height="20" rx="10" fill="#e7f3ed"/>
    <text x="1050" y="828" text-anchor="middle" class="tiny greenText" font-weight="700">ADVENTURE</text>
    <text x="1011" y="861" class="h3">Himalayan Trek</text>
    <text x="1011" y="879" class="tiny muted">Himachal Pradesh · Package performance</text>
    <rect x="1011" y="897" width="104" height="48" rx="7" fill="#fff" stroke="#e7ece8"/>
    <text x="1022" y="916" class="tiny muted">REVENUE</text><text x="1022" y="935" class="small" font-weight="700">₹35.9L</text>
    <rect x="1122" y="897" width="104" height="48" rx="7" fill="#fff" stroke="#e7ece8"/>
    <text x="1133" y="916" class="tiny muted">CONVERSION</text><text x="1133" y="935" class="small" font-weight="700">14.8%</text>
    <rect x="1233" y="897" width="116" height="48" rx="7" fill="#fff" stroke="#e7ece8"/>
    <text x="1244" y="916" class="tiny muted">SATISFACTION</text><text x="1244" y="935" class="small" font-weight="700">4.5 / 5</text>
    <rect x="1011" y="959" width="338" height="39" rx="7" fill="#f2f6e8"/>
    <text x="1023" y="975" class="tiny" font-weight="700" fill="#536943">TRY: CLARIFY DIFFICULTY &amp; TEST VISIBILITY</text>
    <text x="1023" y="990" class="tiny muted">Potential monthly upside: +₹4.2L</text>
    <text x="990" y="1048" class="tiny greenText" font-weight="700">＋ Save to action list</text>
  </g>

  <path d="M474 892h30M934 892h30" stroke="#91b5a5" stroke-width="2"/>
  <path d="m496 886 8 6-8 6M956 886l8 6-8 6" fill="none" stroke="#91b5a5" stroke-width="2"/>
  <rect x="46" y="1110" width="1348" height="94" rx="15" fill="#173c32"/>
  <text x="74" y="1141" class="tiny" fill="#9dc8b5" font-weight="700" letter-spacing="1.2">DESIGN INTENT</text>
  <text x="74" y="1171" font-size="17" fill="#fff" font-weight="650">See the signal → understand the opportunity → take an informed next step.</text>
  <text x="1364" y="1170" text-anchor="end" class="tiny" fill="#c3d9ce">Search · filter · compare · review · save</text>
</svg>
